<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16120E" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Mobile-first workout tracking PWA">
  <title>트레이닝 트래커</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <div class="splash-name">트레이닝 트래커</div>
  </div>
  <div class="phone">
    <header class="appbar">
      <div>
        <h1 id="screen-title"></h1>
        <span class="sub" id="screen-sub"></span>
      </div>
      <span class="timer" id="session-timer" hidden></span>
    </header>

    <main id="screen-root"></main>

    <div class="restbar" id="rest-bar" hidden></div>

    <nav class="tabbar" aria-label="주 탐색" id="tabbar">
      <button class="tab sel" data-screen="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/></svg>
        <span data-tab-label="today"></span>
      </button>
      <button class="tab" data-screen="session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12h2M18 12h2M7 8v8M17 8v8M7 12h10"/></svg>
        <span data-tab-label="session"></span>
      </button>
      <button class="tab" data-screen="log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h9"/></svg>
        <span data-tab-label="log"></span>
      </button>
      <button class="tab" data-screen="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>
        <span data-tab-label="stats"></span>
      </button>
      <button class="tab" data-screen="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span data-tab-label="settings"></span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
